<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Skills · Sandesh Sharma</title>

  <!-- ✅ FAVICON -->
  <link rel="icon" type="image/x-icon" href="favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #f8f0ff 0%, #f0e6ff 100%);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #2c1a4e;
    }

    /* ---------- HEADER CARD ---------- */
    .header-card {
      max-width: 1300px;
      width: 100%;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 56px 40px 56px 40px;
      padding: 1.8rem 2.4rem 1.8rem;
      box-shadow: 0 30px 60px -15px rgba(90, 40, 140, 0.25),
                  0 0 0 1px rgba(200, 170, 255, 0.25) inset;
      border: 1px solid rgba(220, 200, 255, 0.4);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      margin-bottom: 1.8rem;
    }

    .header-card::before {
      content: '';
      position: absolute;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(168, 132, 255, 0.18) 0%, transparent 70%);
      top: -140px;
      right: -120px;
      border-radius: 50%;
      pointer-events: none;
      animation: floatOrb 12s ease-in-out infinite alternate;
    }

    .header-card::after {
      content: '';
      position: absolute;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(106, 61, 232, 0.12) 0%, transparent 70%);
      bottom: -100px;
      left: -80px;
      border-radius: 50%;
      pointer-events: none;
      animation: floatOrb 16s ease-in-out infinite alternate-reverse;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.15); }
    }

    .header-card > * {
      position: relative;
      z-index: 2;
    }

    /* ---------- HEADER TOP BAR ---------- */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    /* Animated logo */
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      text-decoration: none;
    }

    .logo-icon {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      background: linear-gradient(135deg, #6a3de8 0%, #a884ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 8px 22px rgba(106, 61, 232, 0.35),
                  0 0 0 3px rgba(255, 255, 255, 0.6) inset;
      flex-shrink: 0;
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .logo-icon:hover {
      transform: scale(1.08) rotate(-3deg);
    }

    .logo-icon::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.35) 50%, transparent 60%);
      animation: shine 3s infinite;
    }

    @keyframes shine {
      0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
      100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
    }

    .logo-icon i {
      color: #fff;
      font-size: 22px;
      z-index: 2;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }

    .logo-icon .fa-bolt {
      position: absolute;
      font-size: 10px !important;
      color: #ffd700 !important;
      top: 6px;
      right: 6px;
      z-index: 3;
      filter: drop-shadow(0 0 4px rgba(255, 215, 0, 0.8)) !important;
      animation: zap 2s infinite;
    }

    @keyframes zap {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.85); }
    }

    .logo-text {
      font-size: 1.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #3b1f7a, #7b4cff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 0.5px;
    }

    /* Nav pills */
    nav {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    nav a {
      color: #5b3b9e;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.3px;
      padding: 0.5rem 1.2rem;
      border-radius: 60px;
      transition: 0.3s ease;
      border: 1.5px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    nav a:hover {
      background: #ede4ff;
      border-color: #d9c8ff;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(106, 61, 232, 0.15);
      color: #3b1f7a;
    }

    nav a.active {
      background: linear-gradient(135deg, #6a3de8, #a884ff);
      color: #fff;
      box-shadow: 0 8px 24px rgba(106, 61, 232, 0.35);
    }

    /* ---------- HERO ---------- */
    .hero {
      text-align: center;
      padding: 1rem 0 0.5rem;
    }

    .hero h1 {
      font-size: 2.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #3b1f7a, #7b4cff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
      margin-bottom: 0.5rem;
      line-height: 1.15;
    }

    .hero p {
      color: #5b3b9e;
      max-width: 620px;
      margin: 0 auto 1.5rem;
      font-size: 0.95rem;
      line-height: 1.7;
      font-weight: 500;
      background: #ede4ff;
      padding: 0.7rem 1.5rem;
      border-radius: 60px;
      border: 1.5px solid rgba(200, 170, 255, 0.4);
      display: inline-block;
    }

    /* ---------- SOCIAL ICONS ---------- */
    .social {
      display: flex;
      justify-content: center;
      gap: 0.9rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .social a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 50px;
      height: 50px;
      border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
      background: rgba(237, 228, 255, 0.7);
      border: 1.5px solid rgba(200, 170, 255, 0.4);
      color: #5b3b9e;
      font-size: 1.4rem;
      transition: 0.3s ease;
      text-decoration: none;
      box-shadow: 0 6px 16px -8px rgba(106, 61, 232, 0.25);
    }

    .social a:hover {
      transform: translateY(-8px) rotate(4deg) scale(1.1);
      border-color: #a884ff;
      background: #ede4ff;
      box-shadow: 0 0 30px rgba(106, 61, 232, 0.4);
    }

    .social a:nth-child(1):hover { color: #ff0000; border-color: #ff0000; }
    .social a:nth-child(2):hover { color: #e4405f; border-color: #e4405f; }
    .social a:nth-child(3):hover { color: #24292e; border-color: #24292e; }
    .social a:nth-child(4):hover { color: #0a66c2; border-color: #0a66c2; }

    /* ---------- BUTTON ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.85rem 2rem;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #6a3de8, #a884ff);
      color: #fff;
      border-radius: 60px;
      text-decoration: none;
      box-shadow: 0 12px 28px -8px rgba(106, 61, 232, 0.5),
                  0 0 0 1px rgba(255, 255, 255, 0.15) inset;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .btn:hover {
      transform: translateY(-4px) scale(1.03);
      background: linear-gradient(135deg, #5b2fd0, #9a70ff);
      box-shadow: 0 20px 40px -12px rgba(106, 61, 232, 0.6);
    }

    /* ---------- SKILLS SECTION ---------- */
    .skills {
      max-width: 1300px;
      width: 100%;
    }

    .skills h2 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #2c1a4e;
      text-align: center;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }

    .skills h2 i { color: #6a3de8; font-size: 1.4rem; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.3rem;
      margin-bottom: 1.5rem;
    }

    /* ---------- SKILL CARD ---------- */
    .card {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(220, 200, 255, 0.4);
      border-radius: 32px 16px 32px 16px;
      padding: 1.5rem 1.4rem;
      transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.2);
      position: relative;
      overflow: hidden;
      cursor: default;
      box-shadow: 0 20px 40px -15px rgba(90, 40, 140, 0.15),
                  0 0 0 1px rgba(200, 170, 255, 0.2) inset;
      text-align: center;
      opacity: 0;
      animation: cardFadeIn 0.6s ease forwards;
    }

    .card::after {
      content: '';
      position: absolute;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(168, 132, 255, 0.12) 0%, transparent 70%);
      top: -90px;
      right: -90px;
      border-radius: 50%;
      pointer-events: none;
      transition: 0.6s;
    }

    .card:hover::after {
      transform: scale(1.5);
      opacity: 0.85;
    }

    .card:hover {
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 30px 60px -15px rgba(106, 61, 232, 0.35),
                  0 0 0 1px rgba(168, 132, 255, 0.35) inset;
      border-color: #a884ff;
      background: rgba(255, 255, 255, 0.88);
    }

    /* ---------- PROFESSIONAL ICON BOX ---------- */
    .card .icon {
      font-size: 1.5rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 58px;
      height: 58px;
      margin-bottom: 0.9rem;
      border-radius: 18px;
      transition: 0.4s ease;
      color: #fff;
      background: linear-gradient(135deg, #6a3de8, #a884ff);
      box-shadow: 0 10px 24px -8px rgba(106, 61, 232, 0.55),
                  0 0 0 1px rgba(255, 255, 255, 0.25) inset;
    }

    /* Har icon ka apna unique color */
    .card .icon.icon-computer   { background: linear-gradient(135deg, #6a3de8, #a884ff); }
    .card .icon.icon-comm       { background: linear-gradient(135deg, #1dd1a1, #10ac84); }
    .card .icon.icon-language   { background: linear-gradient(135deg, #5f27cd, #341f97); }
    .card .icon.icon-quick      { background: linear-gradient(135deg, #feca57, #ff9f43); }
    .card .icon.icon-design     { background: linear-gradient(135deg, #ff6b9d, #c44569); }
    .card .icon.icon-webdev     { background: linear-gradient(135deg, #4facfe, #00f2fe); }
    .card .icon.icon-java       { background: linear-gradient(135deg, #f89820, #ed8b00); }
    .card .icon.icon-python     { background: linear-gradient(135deg, #3776ab, #ffd343); }
    .card .icon.icon-cpp        { background: linear-gradient(135deg, #00599c, #0080ff); }

    .card:hover .icon {
      transform: scale(1.15) rotate(-6deg);
      box-shadow: 0 14px 32px -8px rgba(106, 61, 232, 0.7);
    }

    .card h3 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.9rem;
      color: #2c1a4e;
      transition: 0.3s;
      letter-spacing: 0.2px;
    }

    .card:hover h3 {
      background: linear-gradient(135deg, #3b1f7a, #7b4cff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .bar {
      height: 9px;
      background: #ede4ff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(106, 61, 232, 0.1);
      border: 1px solid rgba(200, 170, 255, 0.3);
    }

    .fill {
      height: 100%;
      background: linear-gradient(90deg, #6a3de8, #a884ff);
      border-radius: 20px;
      transition: width 1.2s cubic-bezier(0.22, 0.61, 0.36, 1);
      box-shadow: 0 0 14px rgba(106, 61, 232, 0.5);
      position: relative;
    }

    .fill::after {
      content: '';
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 10px;
      height: 10px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 12px #a884ff;
      opacity: 0.85;
    }

    .percent {
      text-align: right;
      color: #7a5fa8;
      font-size: 0.78rem;
      font-weight: 700;
      margin-top: 0.5rem;
      transition: 0.3s;
    }

    .card:hover .percent {
      color: #6a3de8;
    }

    /* ---------- HIRE ME ---------- */
    .hire-link {
      max-width: 1300px;
      width: 100%;
      display: block;
      text-align: center;
      text-decoration: none;
      padding: 1.5rem 0 0.5rem;
      transition: 0.3s;
    }

    .hire-link h2 {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.4rem;
      font-weight: 800;
      padding: 0.9rem 2.2rem;
      border-radius: 60px;
      background: linear-gradient(135deg, #6a3de8, #a884ff);
      color: #fff;
      box-shadow: 0 12px 28px -8px rgba(106, 61, 232, 0.5);
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
    }

    .hire-link h2 i { color: #fff; }

    .hire-link:hover h2 {
      transform: translateY(-4px) scale(1.04);
      background: linear-gradient(135deg, #5b2fd0, #9a70ff);
      box-shadow: 0 20px 40px -12px rgba(106, 61, 232, 0.6);
      letter-spacing: 1.5px;
    }

    /* ---------- FOOTER ---------- */
    .page-footer {
      max-width: 1300px;
      width: 100%;
      text-align: center;
      padding: 1.4rem 1.5rem;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 40px;
      border: 1px solid rgba(220, 200, 255, 0.4);
      box-shadow: 0 12px 28px -10px rgba(80, 40, 160, 0.1);
      color: #7a5fa8;
      font-size: 0.88rem;
      margin-top: 1.5rem;
    }

    .page-footer .heart {
      display: inline-block;
      animation: pulse 1.8s infinite;
      color: #ef4444;
    }

    .page-footer i { color: #6a3de8; }
    .page-footer .heart i { color: #ef4444; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    /* ---------- ANIMATIONS ---------- */
    @keyframes cardFadeIn {
      0% { opacity: 0; transform: translateY(24px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 768px) {
      body { padding: 1rem; }

      .header-card {
        padding: 1.4rem 1.4rem 1.3rem;
        border-radius: 40px 28px 40px 28px;
      }

      .top-bar { flex-direction: column; align-items: stretch; gap: 0.8rem; }
      nav { justify-content: center; }
      .brand { justify-content: center; }

      .hero h1 { font-size: 1.8rem; }
      .hero p { font-size: 0.85rem; padding: 0.6rem 1.1rem; }

      .grid {
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 1rem;
      }

      .card { padding: 1.2rem 1rem; }
      .card .icon { width: 50px; height: 50px; font-size: 1.3rem; }
      .card h3 { font-size: 0.9rem; }

      .hire-link h2 { font-size: 1.15rem; padding: 0.8rem 1.6rem; }
      .page-footer { padding: 1rem; font-size: 0.78rem; border-radius: 30px; }
    }

    @media (max-width: 480px) {
      body { padding: 0.8rem; }
      .header-card { padding: 1.2rem 1rem 1.1rem; }
      .hero h1 { font-size: 1.5rem; }
      .hero p { font-size: 0.78rem; }
      .logo-icon { width: 42px; height: 42px; border-radius: 13px; }
      .logo-icon i { font-size: 18px; }
      .logo-text { font-size: 1rem; }

      .grid { grid-template-columns: 1fr 1fr; gap: 0.7rem; }
      .card { padding: 1rem 0.7rem; border-radius: 24px 12px 24px 12px; }
      .card .icon { width: 44px; height: 44px; font-size: 1.1rem; border-radius: 14px; }
      .card h3 { font-size: 0.78rem; }
      .percent { font-size: 0.68rem; }

      .social a { width: 42px; height: 42px; font-size: 1.2rem; }
      .btn { padding: 0.7rem 1.4rem; font-size: 0.85rem; }
      .hire-link h2 { font-size: 1rem; padding: 0.7rem 1.3rem; }
    }
  </style>
</head>
<body>

  <!-- ========== HEADER CARD ========== -->
  <header class="header-card">
    <div class="top-bar">
      <a href="index.html" class="brand">
        <div class="logo-icon">
          <i class="fas fa-star"></i>
          <i class="fas fa-bolt fa-bolt"></i>
        </div>
        <span class="logo-text">SANDESH SHARMA</span>
      </a>

      <nav>
        <a href="index.html"><i class="fas fa-home"></i> Home</a>
        <a href="#skills" class="active"><i class="fas fa-star"></i> Skills</a>
        <a href="telegram.html"><i class="fas fa-briefcase"></i> Hire</a>
      </nav>
    </div>

    <!-- HERO -->
    <div class="hero">
      <h1>Web Designer &amp; Developer</h1>
      <p>I create modern, responsive and attractive websites with HTML, CSS and JavaScript.</p>

      <div class="social">
        <a href="https://youtube.com/@fect_4sandesh?si=56CtmZM87h-5iKc4" target="_blank" title="YouTube"><i class="fab fa-youtube"></i></a>
        <a href="https://www.instagram.com/the_sandesh_sharma?igsh=MWhiYTlnY3h0anpwNQ==" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
        <a href="#" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
        <a href="#" target="_blank" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
      </div>

      <a href="telegram.html" class="btn">
        <i class="fas fa-briefcase"></i> Hire Me
      </a>
    </div>
  </header>

  <!-- ========== SKILLS SECTION ========== -->
  <section id="skills" class="skills">
    <h2><i class="fas fa-bolt"></i> My Skills</h2>
    <div class="grid" id="skillsGrid">
      <!-- skills injected by JS -->
    </div>
  </section>

  <!-- ========== HIRE ME LINK ========== -->
  <a href="telegram.html" class="hire-link" id="hire">
    <h2><i class="fas fa-paper-plane"></i> Hire Me</h2>
  </a>

  <!-- ========== PAGE FOOTER ========== -->
  <footer class="page-footer">
    <p>
      <span class="heart"><i class="fas fa-heart"></i></span>
      Made with Love · Created by <strong style="color:#3b1f7a;">Sandesh Sharma</strong>
    </p>
  </footer>

  <script>
    (function() {
      const skillsData = [
        { icon: 'fa-solid fa-laptop-code', cls: 'icon-computer', name: 'Advance Computer Knowledge', level: '95%' },
        { icon: 'fa-solid fa-comments',    cls: 'icon-comm',     name: 'Communication Skills',       level: '90%' },
        { icon: 'fa-solid fa-language',    cls: 'icon-language', name: 'Hindi & English',            level: '88%' },
        { icon: 'fa-solid fa-bolt',        cls: 'icon-quick',    name: 'Quick Learner',              level: '97%' },
        { icon: 'fa-solid fa-pen-ruler',   cls: 'icon-design',   name: 'Web Design',                 level: '92%' },
        { icon: 'fa-solid fa-globe',       cls: 'icon-webdev',   name: 'Web Development',            level: '90%' },
        { icon: 'fa-brands fa-java',       cls: 'icon-java',     name: 'Java',                       level: '85%' },
        { icon: 'fa-brands fa-python',     cls: 'icon-python',   name: 'Python',                     level: '91%' },
        { icon: 'fa-solid fa-code',        cls: 'icon-cpp',      name: 'C++ Programming',            level: '87%' }
      ];

      const grid = document.getElementById('skillsGrid');
      if (grid) {
        grid.innerHTML = skillsData.map((s, i) => `
          <div class="card" style="animation-delay: ${0.05 * (i + 1)}s;">
            <div class="icon ${s.cls}"><i class="${s.icon}"></i></div>
            <h3>${s.name}</h3>
            <div class="bar">
              <div class="fill" style="width: ${s.level};"></div>
            </div>
            <div class="percent">${s.level}</div>
          </div>
        `).join('');
      }
    })();
  </script>
</body>
</html>
